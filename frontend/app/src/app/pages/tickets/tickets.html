<main class="tickets-page">
  <div class="tickets-page__wrapper">
    <aside class="tickets-page__sidebar">
      <app-filters [config]="filterConfig" (filtersChanged)="onFiltersChanged($event)" />
    </aside>

    <section class="tickets-page__main">
      <div class="tickets-page__tabs">
        <button
          class="tickets-page__tab"
          [class.tickets-page__tab--active]="activeTab === 'available'"
          (click)="switchTab('available')"
        >
          Доступні тікети
        </button>

        <button
          class="tickets-page__tab"
          [class.tickets-page__tab--active]="activeTab === 'my'"
          (click)="switchTab('my')"
        >
          Мої тікети
        </button>
      </div>

      @if (loading) {
        <div class="tickets-page__loading">
          <div class="tickets-page__spinner"></div>
          <span>Завантаження тікетів...</span>
        </div>
      }

      @if (error) {
        <p class="tickets-page__error">Помилка завантаження. Спробуйте пізніше.</p>
      }

      @if (!loading) {
        <app-tickets-list [tickets]="filteredTickets" />

        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="hasNextPage ? currentPage + 1 : currentPage"
          (pageChanged)="goToPage($event)"
        />
      }
    </section>
  </div>
</main>
