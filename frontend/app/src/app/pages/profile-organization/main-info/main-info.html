<div class="main-info">
  <div class="main-info__avatar">
    <img
      [src]="
        organization?.logo_url ||
        'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27 viewBox=%270 0 200 200%27%3E%3Crect width=%27200%27 height=%27200%27 fill=%27%23f3f4f6%27/%3E%3Cpath d=%27M100 52c-15.464 0-28 12.536-28 28s12.536 28 28 28 28-12.536 28-28-12.536-28-28-28zm0 70c-23.196 0-42 18.804-42 42h84c0-23.196-18.804-42-42-42z%27 fill=%27%239ca3af%27/%3E%3C/svg%3E'
      "
      [alt]="organization?.name"
    />
  </div>
  <div class="main-info__details">
    <div class="main-info__header">
      <h1 class="main-info__name">
        {{ organization?.name }}
      </h1>
    </div>

    <div class="main-info__rating">
      <p>
        <span class="main-info__stars">Місто: </span>
        <span class="main-info__points">{{ organization?.city || location?.city }}</span>
      </p>

      <p>
        <span class="main-info__stars">Адреса: </span>
        <span class="main-info__points">{{ location?.address }}</span>
      </p>

      <p>
        <span class="main-info__stars">Категорія: </span>
        <span class="main-info__points">{{ organization?.category }}</span>
      </p>

      <p>
        <span class="main-info__stars">Зв'язок: </span>
        <span class="main-info__points">{{ organization?.contact_email }}</span>
      </p>
    </div>
  </div>
</div>
