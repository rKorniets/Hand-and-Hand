<section class="home__footer">
  <div class="home__footer__flex">
    <h2 class="home__footer__title">Останні події</h2>
    <a routerLink="/events" class="home__footer__button">Переглянути всі</a>
  </div>

  <div class="home__footer__grid">
    @for (event of events; track event.id) {
      <a [routerLink]="['/events', event.id]" class="event-card">
        <div class="event-card__image-wrapper">
          @if (event.image_url) {
            <img [src]="event.image_url" alt="{{ event.title }}" class="event-card__img" />
          } @else {
            <div class="event-card__placeholder">
              <span>Подія</span>
            </div>
          }
        </div>

        <div class="event-card__content">
          <h3 class="event-card__title">{{ event.title }}</h3>
        </div>
      </a>
    } @empty {
      <div class="home__footer__empty">
        <p>Наразі немає актуальних подій</p>
      </div>
    }
  </div>
</section>
